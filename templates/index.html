
<!DOCTYPE html>
<html>
<head>
    <title>Student Marks System</title>
    <link rel="stylesheet"
          href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
<div class="container">
    <h1>Student Marks Management</h1>

    <form method="POST">
        <input name="name" placeholder="Student name" required>
        <input name="marks" type="number" min="0" max="100"
               step="any" placeholder="Marks" required>
        <button type="submit">Add Student</button>
    </form>

    <form method="GET">
        <input name="search" value="{{ search }}"
               placeholder="Search student name">
        <button type="submit">Search</button>
        <a href="/">Clear</a>
    </form>

    <h2>Student Records</h2>
    <table>
        <tr>
            <th>Name</th><th>Marks</th><th>Grade</th><th>Actions</th>
        </tr>
        {% for student in students %}
        <tr>
            <td>{{ student.name }}</td>
            <td>{{ student.marks }}</td>
            <td>{{ student.grade }}</td>
            <td>
                <form action="/edit/{{ student.id }}" method="POST">
                    <input name="marks" type="number" min="0" max="100"
                           step="any" placeholder="New marks" required>
                    <button type="submit">Update</button>
                </form>
                <form action="/delete/{{ student.id }}" method="POST">
                    <button type="submit">Delete</button>
                </form>
            </td>
        </tr>
        {% endfor %}
    </table>
</div>
</body>
</html>
